<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦊 Мемори — Учим звук [С]</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(255,255,255,0.2) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== ГЛАВНЫЙ КОНТЕЙНЕР ===== */
  .game-wrapper {
    display: flex;
    height: 100vh;
    height: 100dvh;
    position: relative;
    z-index: 1;
    padding: 12px;
    gap: 12px;
  }

  /* ===== ЛЕВАЯ ПАНЕЛЬ (статистика) ===== */
  .side-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    flex-shrink: 0;
    width: 130px;
  }

  .stat-box {
    background: rgba(255,255,255,0.92);
    border-radius: 16px;
    padding: 10px 14px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    backdrop-filter: blur(10px);
  }

  .stat-box .label {
    font-size: 0.7em;
    color: #888;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .stat-box .value {
    font-size: 1.8em;
    font-weight: 900;
    line-height: 1;
  }

  .stat-box .value.moves { color: #3498db; }
  .stat-box .value.pairs { color: #2ecc71; }
  .stat-box .value.timer { color: #9b59b6; }

  .btn {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 16px;
    font-size: 0.9em;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(79,172,254,0.4);
    transition: all 0.3s ease;
    font-family: 'Nunito', sans-serif;
    text-align: center;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,172,254,0.5); }
  .btn:active { transform: translateY(0); }

  .btn-start {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    box-shadow: 0 4px 15px rgba(245,87,108,0.4);
    font-size: 1em;
    padding: 14px 20px;
  }

  .btn-start:hover { box-shadow: 0 6px 20px rgba(245,87,108,0.5); }

  /* ===== ИГРОВОЕ ПОЛЕ ===== */
  .game-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    flex: 1;
    min-width: 0;
    min-height: 0;
    perspective: 1000px;
  }

  /* ===== КАРТОЧКА ===== */
  .card {
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 14px;
    width: 100%;
    height: 100%;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card.matched {
    transform: rotateY(180deg);
    animation: matchPulse 0.6s ease;
  }

  .card.matched .card-front {
    box-shadow: 0 0 20px rgba(46,204,113,0.7);
    border-color: #2ecc71;
  }

  .card.shake { animation: shake 0.5s ease; }

  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  @keyframes matchPulse {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.06); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-back {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    border: 3px solid rgba(255,255,255,0.3);
    z-index: 2;
  }

  .card-back::before {
    content: '?';
    font-size: 3em;
    font-weight: 900;
    color: rgba(255,255,255,0.8);
  }

  .card-back::after {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 10px;
  }

  .card-front {
    background: #fff;
    transform: rotateY(180deg);
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    border: 3px solid #eee;
    flex-direction: column;
    padding: 0;
  }

  /* Картинка полностью заполняет карточку */
  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 11px;
  }

  /* ===== СТАРТОВЫЙ ПОПАП ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease;
    backdrop-filter: blur(5px);
  }

  .modal-overlay.show { opacity: 1; visibility: visible; }

  .modal {
    background: #fff;
    border-radius: 30px;
    padding: 35px 30px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    transform: scale(0.8);
    transition: transform 0.4s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .modal-overlay.show .modal { transform: scale(1); }

  .modal .fox-img {
    width: 140px;
    height: 140px;
    margin: 0 auto 10px;
    object-fit: contain;
    animation: bounce 1.5s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .modal h2 {
    font-size: 1.8em;
    color: #e74c3c;
    margin-bottom: 10px;
  }

  .modal p {
    font-size: 1em;
    color: #666;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .modal .rules {
    background: #f8f9fa;
    border-radius: 14px;
    padding: 12px 16px;
    margin: 12px 0 18px;
    text-align: left;
    font-size: 0.9em;
    color: #555;
    line-height: 1.6;
  }

  .modal .rules li {
    margin-bottom: 4px;
    list-style: none;
  }

  .modal .rules li::before {
    content: ' ';
  }

  .modal .stars { font-size: 2.5em; margin-bottom: 10px; }
  .modal .btn { font-size: 1.1em; padding: 14px 35px; }

  /* ===== КОНФЕТТИ ===== */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    width: 10px; height: 10px;
    top: -10px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== МОБИЛЬНАЯ ВЕРСИЯ ===== */
  @media (max-width: 600px) {
    .game-wrapper {
      flex-direction: column;
      padding: 6px;
      gap: 6px;
    }

    .side-panel {
      flex-direction: row;
      width: 100%;
      justify-content: space-around;
      gap: 4px;
      flex-shrink: 0;
    }

    .stat-box {
      padding: 4px 8px;
      border-radius: 10px;
      flex: 1;
    }

    .stat-box .label { font-size: 0.55em; margin-bottom: 0; }
    .stat-box .value { font-size: 1.2em; }

    .btn {
      padding: 6px 10px;
      font-size: 0.7em;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .game-board {
      gap: 5px;
      flex: 1;
    }

    .card { border-radius: 10px; }
    .card-back::before { font-size: 2em; }
    .card-front img { border-radius: 8px; }
  }

  @media (max-width: 380px) {
    .game-board { gap: 4px; }
    .card { border-radius: 8px; }
    .card-front img { border-radius: 6px; }
    .stat-box .value { font-size: 1em; }
  }
</style>
</head>
<body>

<!-- ===== СТАРТОВЫЙ ПОПАП ===== -->
<div class="modal-overlay show" id="startModal">
  <div class="modal">
    <img class="fox-img" src="fox.png" alt="Лисичка"
         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>'">
    <h2>Привет! Я лисичка! </h2>
    <p>Давай поиграем в Мемори и выучим звук <b>[С]</b>!</p>
    <ul class="rules">
      <li>Нажимай на карточки, чтобы перевернуть их</li>
      <li>Найди все 8 пар одинаковых картинок</li>
      <li>Все слова содержат звук [С]!</li>
    </ul>
    <button class="btn btn-start" onclick="startGame()">🎮 Начать игру!</button>
  </div>
</div>

<!-- ===== ПОПАП ПОБЕДЫ ===== -->
<div class="modal-overlay" id="winModal">
  <div class="modal">
    <img class="fox-img" src="fox.png" alt="Лисичка"
         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>'">
    <h2>Ура! Ты победил! 🎉</h2>
    <div class="stars" id="starsDisplay">⭐⭐⭐</div>
    <p id="winText">Ты нашёл все 8 пар!</p>
    <button class="btn btn-start" onclick="resetGame()">🔄 Играть ещё!</button>
  </div>
</div>

<!-- ===== ИГРА ===== -->
<div class="game-wrapper">
  <!-- Левая панель -->
  <div class="side-panel">
    <div class="stat-box">
      <div class="label">Ходы</div>
      <div class="value moves" id="moves">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Пары</div>
      <div class="value pairs" id="pairs">0/8</div>
    </div>
    <div class="stat-box">
      <div class="label">Время</div>
      <div class="value timer" id="timer">0:00</div>
    </div>
    <button class="btn" onclick="resetGame()">🔄 Заново</button>
  </div>

  <!-- Игровое поле -->
  <div class="game-board" id="gameBoard"></div>
</div>

<!-- Конфетти -->
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ===== ДАННЫЕ ИГРЫ (8 пар) =====
const cardsData = [
  { id: 'aist',    name: 'Аист',    img: 'aist.png' },
  { id: 'bus',     name: 'Автобус', img: 'bus.png' },
  { id: 'busi',    name: 'Бусы',    img: 'busi.png' },
  { id: 'chasi',   name: 'Часы',    img: 'chasi.png' },
  { id: 'kaktus',  name: 'Кактус',  img: 'kaktus.png' },
  { id: 'kapusta', name: 'Капуста', img: 'kapusta.png' },
  { id: 'kokos',   name: 'Кокос',   img: 'kokos.png' },
  { id: 'koleso',  name: 'Колесо',  img: 'koleso.png' },
];

// ===== СОСТОЯНИЕ ИГРЫ =====
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let isLocked = false;
let timerInterval = null;
let seconds = 0;
let gameStarted = false;

// ===== ЗАПУСК ИГРЫ =====
function startGame() {
  document.getElementById('startModal').classList.remove('show');
  initGame();
}

function initGame() {
  const pairs = [...cardsData, ...cardsData];
  cards = shuffle(pairs);

  const board = document.getElementById('gameBoard');
  board.innerHTML = '';

  cards.forEach((card, index) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.index = index;
    cardEl.dataset.id = card.id;

    cardEl.innerHTML = `
      <div class="card-face card-back"></div>
      <div class="card-face card-front">
        <img src="${card.img}" alt="${card.name}"
             onerror="this.style.display='none';">
      </div>
    `;

    cardEl.addEventListener('click', () => flipCard(cardEl, index));
    board.appendChild(cardEl);
  });

  moves = 0;
  matchedPairs = 0;
  seconds = 0;
  gameStarted = false;
  flippedCards = [];
  isLocked = false;
  updateStats();
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = '0:00';
}

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== ЛОГИКА ИГРЫ =====
function flipCard(cardEl, index) {
  if (isLocked) return;
  if (cardEl.classList.contains('flipped')) return;
  if (cardEl.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  if (!gameStarted) {
    gameStarted = true;
    startTimer();
  }

  cardEl.classList.add('flipped');
  flippedCards.push({ el: cardEl, index, id: cards[index].id });

  if (flippedCards.length === 2) {
    moves++;
    updateStats();
    checkMatch();
  }
}

function checkMatch() {
  isLocked = true;
  const [card1, card2] = flippedCards;

  if (card1.id === card2.id) {
    setTimeout(() => {
      card1.el.classList.add('matched');
      card2.el.classList.add('matched');
      matchedPairs++;
      updateStats();
      flippedCards = [];
      isLocked = false;

      if (matchedPairs === cardsData.length) {
        setTimeout(showWin, 600);
      }
    }, 500);
  } else {
    setTimeout(() => {
      card1.el.classList.add('shake');
      card2.el.classList.add('shake');
    }, 400);

    setTimeout(() => {
      card1.el.classList.remove('flipped', 'shake');
      card2.el.classList.remove('flipped', 'shake');
      flippedCards = [];
      isLocked = false;
    }, 1000);
  }
}

// ===== ТАЙМЕР =====
function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    document.getElementById('timer').textContent =
      `${mins}:${secs.toString().padStart(2, '0')}`;
  }, 1000);
}

// ===== СТАТИСТИКА =====
function updateStats() {
  document.getElementById('moves').textContent = moves;
  document.getElementById('pairs').textContent = `${matchedPairs}/${cardsData.length}`;
}

// ===== ПОБЕДА =====
function showWin() {
  clearInterval(timerInterval);

  let stars = '⭐⭐⭐';
  if (moves > 12) stars = '⭐⭐';
  if (moves > 18) stars = '⭐';

  document.getElementById('starsDisplay').textContent = stars;
  document.getElementById('winText').innerHTML =
    `Ты нашёл все 8 пар за <b>${moves}</b> ходов!<br>Время: <b>${document.getElementById('timer').textContent}</b><br>Лисичка гордится тобой! 🦊`;

  document.getElementById('winModal').classList.add('show');
  launchConfetti();
}

// ===== КОНФЕТТИ =====
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#f5576c', '#4facfe', '#43e97b', '#fa709a', '#fee140', '#a18cd1', '#fbc2eb'];

  for (let i = 0; i < 60; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.width = (Math.random() * 10 + 5) + 'px';
    confetti.style.height = (Math.random() * 10 + 5) + 'px';
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
    confetti.style.animationDelay = (Math.random() * 2) + 's';
    container.appendChild(confetti);
  }

  setTimeout(() => { container.innerHTML = ''; }, 5000);
}

// ===== СБРОС =====
function resetGame() {
  document.getElementById('winModal').classList.remove('show');
  document.getElementById('confettiContainer').innerHTML = '';
  initGame();
}
</script>

</body>
</html>
